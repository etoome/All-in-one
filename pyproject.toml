[project]
name = "all-in-one"
version = "1.1.0"
description = "PowerPoint ribbon add-in combining built-in commands and VBA tools."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pywin32; sys_platform == 'win32'",
    "Pillow>=9.1",
]

[dependency-groups]
dev = [
    "commitizen",
]

[tool.uv]
# Scripts project: nothing to build or install, only dependencies.
package = false
system-certs = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
bump_message = "chore(release): v$new_version"
annotated_tag = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
template = "scripts/templates/changelog.md.j2"
change_type_map = { feat = "Features", fix = "Bug Fixes", perf = "Performance", refactor = "Refactoring" }
change_type_order = ["Features", "Bug Fixes", "Performance", "Refactoring"]
# Runs after pyproject.toml gets the new version; the release commit uses `git commit -a`, so the refreshed uv.lock is included.
pre_bump_hooks = ["uv run --upgrade-package all-in-one scripts/build.py"]

[tool.commitizen.extras]
repo_url = "https://github.com/etoome/All-in-one"
