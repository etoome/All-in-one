[project]
name = "all-in-one"
version = "1.0.3"
description = "PowerPoint ribbon add-in combining built-in commands and VBA tools."
requires-python = ">=3.11"
dependencies = [
    "pywin32; sys_platform == 'win32'",
    "Pillow>=9.1",
]

[dependency-groups]
dev = [
    "commitizen",
    "python-semantic-release",
]

[tool.uv]
# Scripts project: nothing to build or install, only dependencies.
package = false
system-certs = true

[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
allow_zero_version = true
major_on_zero = false
build_command = 'cmd /c "uv run --upgrade-package all-in-one scripts/build.py && git add uv.lock"'

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
